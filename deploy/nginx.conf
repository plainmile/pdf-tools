server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # This unlinked deployment probe must be revalidated at the edge. It is
    # intentionally separate from editable page titles, meta copy, and H1s.
    location = /.well-known/plainmile-release {
        default_type text/plain;
        try_files $uri =404;
        expires -1;
        # An unlinked machine-readable probe is not a search landing page.
        # Re-declare security headers: location-level add_header overrides
        # the server-level add_header inheritance in Nginx 1.30.
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }

    # This unversioned Worker path is shared across releases. A seven-day cache
    # can serve an older PDF.js Worker with a newer hashed application bundle.
    # Force revalidation without disabling caching for versioned build assets.
    location = /pdfjs/pdf.worker.min.mjs {
        types { application/javascript mjs; }
        default_type application/javascript;
        try_files $uri =404;
        expires -1;
    }

    location ~* \.(?:js|mjs)$ {
        types { application/javascript js mjs; }
        default_type application/javascript;
        try_files $uri =404;
        expires 7d;
    }

    location ~* \.(?:css|svg|png|jpg|jpeg|webp|woff|woff2)$ {
        try_files $uri =404;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
