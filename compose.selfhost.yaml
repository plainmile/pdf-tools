# For anyone self-hosting the public image.
# No pre-existing Docker network, secrets, database or source code required.
# This is separate from compose.prod.yaml used by the PlainMile netcup VPS.
services:
  pdf-tools:
    image: ghcr.io/plainmile/pdf-tools:latest
    restart: unless-stopped
    ports:
      - "${PDF_TOOLS_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -qx ok"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
