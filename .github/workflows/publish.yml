name: Publish Image
on:
  workflow_run:
    workflows: ['PDF Tools CI']
    types: [completed]
    # Do not generate skipped releases for feature-branch or PR CI events.
    branches: [main]
permissions:
  contents: read
  packages: write
concurrency:
  # Only one publisher may update the mutable :latest tag at a time.
  group: pdf-tools-publish-main
  cancel-in-progress: false

jobs:
  publish:
    # Never publish an untested main commit (or a stale successful CI run).
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == 'plainmile/pdf-tools' &&
          github.sha == github.event.workflow_run.head_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Check current main commit after waiting for publish queue
        id: main-head
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_sha=$(curl --fail --silent --show-error --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/plainmile/pdf-tools/branches/main | jq -er '.commit.sha')
          if [ "$current_sha" = "$EXPECTED_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo "Skipping superseded image publish: $EXPECTED_SHA; current main is $current_sha"
            echo 'current=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Docker login
        if: steps.main-head.outputs.current == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish commit-pinned image
        if: steps.main-head.outputs.current == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/plainmile/pdf-tools:latest
            ghcr.io/plainmile/pdf-tools:${{ github.event.workflow_run.head_sha }}
