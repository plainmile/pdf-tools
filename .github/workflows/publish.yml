name: Publish Image
on:
  workflow_run:
    workflows: ['PDF Tools CI']
    types: [completed]
    # Do not generate skipped releases for feature-branch or PR CI events.
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    # Never publish an untested main commit (or a stale successful CI run).
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == 'plainmile/pdf-tools' &&
          github.sha == github.event.workflow_run.head_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish commit-pinned image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/plainmile/pdf-tools:latest
            ghcr.io/plainmile/pdf-tools:${{ github.event.workflow_run.head_sha }}
