name: Deploy PDF Tools to netcup

on:
  workflow_run:
    workflows:
      - Publish Image
    types:
      - completed
    # Ignore Publish workflow_run events associated with feature branches.
    branches: [main]

permissions:
  contents: read
  # The GHCR container may be private; avoid unauthenticated VPS pulls.
  packages: read

concurrency:
  group: pdf-tools-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == 'plainmile/pdf-tools' &&
          github.sha == github.event.workflow_run.head_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout published commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify deploy configuration and pin SSH host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          set -eu
          for value in DEPLOY_SSH_KEY DEPLOY_HOST DEPLOY_USER DEPLOY_HOST_KEY; do
            if [ -z "${!value}" ]; then
              echo "Missing GitHub Actions secret $value for plainmile/pdf-tools" >&2
              exit 1
            fi
          done
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          if [ "$DEPLOY_PORT" = 22 ]; then
            host_pattern="$DEPLOY_HOST"
          else
            host_pattern="[$DEPLOY_HOST]:$DEPLOY_PORT"
          fi
          printf '%s %s\n' "$host_pattern" "$DEPLOY_HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      # A successful push does not prove the VPS can pull a private GHCR package.
      # Fail before modifying the existing healthy release when read permission is missing.
      - name: Verify published image is readable using the deployment token
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          auth_dir=$(mktemp -d)
          trap 'rm -rf "$auth_dir"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker --config "$auth_dir" login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null
          DOCKER_CONFIG="$auth_dir" docker buildx imagetools inspect "ghcr.io/plainmile/pdf-tools:$IMAGE_TAG" >/dev/null

      - name: Copy isolated Compose configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          set -eu
          # Existing Compose services live under /opt/compose on this VPS.
          # Move the old pdf-tools directory only when the target does not
          # exist; never overwrite or delete a pre-existing target directory.
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            '/bin/sh -s' <<'REMOTE'
          set -eu
          mkdir -p /opt/compose
          if [ -L /opt/compose/pdf-tools ]; then
            echo 'Refusing to deploy through a symlink at /opt/compose/pdf-tools' >&2
            exit 1
          fi
          if [ ! -e /opt/compose/pdf-tools ] && [ -d /opt/data/compose/pdf-tools ] && [ ! -L /opt/data/compose/pdf-tools ]; then
            mv /opt/data/compose/pdf-tools /opt/compose/pdf-tools
          else
            mkdir -p /opt/compose/pdf-tools
          fi
          test -d /opt/compose/pdf-tools
          if [ -d /opt/data/compose/pdf-tools ]; then
            echo 'Legacy compose directory still exists; leave it untouched until manually reviewed.'
          fi
          REMOTE
          scp -P "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes compose.prod.yaml \
            "$DEPLOY_USER@$DEPLOY_HOST:/opt/compose/pdf-tools/compose.prod.yaml"

      # Record the ACTUALLY RUNNING healthy SHA, never just an .env value.
      - name: Capture previous healthy release
        id: checkpoint
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          set -euo pipefail
          previous_sha=$(ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            '/bin/sh -s' <<'REMOTE'
          set -eu
          image=$(docker inspect -f '{{.Config.Image}}' plainmile-pdf-tools 2>/dev/null || true)
          health=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' plainmile-pdf-tools 2>/dev/null || true)
          working_dir=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' plainmile-pdf-tools 2>/dev/null || true)
          if [ "$health" = healthy ] && [ "$working_dir" = /opt/compose/pdf-tools ]; then
            case "$image" in
              ghcr.io/plainmile/pdf-tools:*)
                tag=${image#ghcr.io/plainmile/pdf-tools:}
                case "$tag" in
                  *[!0-9a-f]*|'') ;;
                  *) if [ "${#tag}" -eq 40 ]; then printf '%s\n' "$tag"; fi ;;
                esac
                ;;
            esac
          fi
          REMOTE
          )
          # First installs and unknown/unhealthy previous images have no safe
          # rollback target. Skip rather than guessing or changing other apps.
          printf 'previous_sha=%s\n' "$previous_sha" >> "$GITHUB_OUTPUT"

      - name: Deploy the exact published image and check its health
        id: deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          # Short-lived Actions token: scoped to this repository, not a stored VPS PAT.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -eu
          case "$IMAGE_TAG" in
            *[!0-9a-f]*|'') echo 'Invalid image SHA' >&2; exit 1 ;;
          esac
          test "${#IMAGE_TAG}" = 40
          # Send the token as the first SSH stdin line (never in argv, URL or
          # a persistent file), followed by a fixed, quoted deployment script.
          {
            printf '%s\n' "$GHCR_TOKEN"
            cat <<'REMOTE'
          set -eu
          cd /opt/compose/pdf-tools
          docker compose -f compose.prod.yaml config --quiet
          docker network inspect edge >/dev/null
          # Store Docker credentials only in a private temporary directory,
          # remove them even on failure, then keep the existing SHA/health gate.
          umask 077
          auth_dir=$(mktemp -d)
          trap 'rm -rf "$auth_dir"' EXIT
          export DOCKER_CONFIG="$auth_dir"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null
          unset GHCR_TOKEN
          printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG" > .env
          docker compose -f compose.prod.yaml pull
          docker compose -f compose.prod.yaml up -d
          for i in $(seq 1 24); do
            status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' plainmile-pdf-tools 2>/dev/null || true)
            if [ "$status" = healthy ]; then
              working_dir=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' plainmile-pdf-tools)
              image=$(docker inspect -f '{{.Config.Image}}' plainmile-pdf-tools)
              if [ "$working_dir" != /opt/compose/pdf-tools ]; then
                echo "Unexpected Compose working directory: $working_dir" >&2
                exit 1
              fi
              if [ "$image" != "ghcr.io/plainmile/pdf-tools:$IMAGE_TAG" ]; then
                echo "Healthy container is running a different image: $image" >&2
                exit 1
              fi
              exit 0
            fi
            sleep 5
          done
          docker compose -f compose.prod.yaml ps
          docker logs --tail 60 plainmile-pdf-tools || true
          exit 1
          REMOTE
          } | ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "IMAGE_TAG=$IMAGE_TAG GHCR_USER=$GHCR_USER /bin/sh -c 'IFS= read -r GHCR_TOKEN; export GHCR_TOKEN; exec /bin/sh -s'"

      - name: Diagnose origin certificate and local proxy (public metadata only)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          set -eu
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            '/bin/sh -s' <<'REMOTE'
          echo '=== Public metadata of origin certificate served with SNI pdf.plainmile.com ==='
          if command -v openssl >/dev/null 2>&1; then
            openssl s_client -connect 127.0.0.1:443 -servername pdf.plainmile.com </dev/null 2>/dev/null |
              openssl x509 -noout -subject -issuer -dates -ext subjectAltName || true
          else
            echo 'openssl not found on VPS'
          fi
          echo '=== Local origin HTTPS status; -k used only for diagnostic ==='
          curl --connect-timeout 5 --max-time 12 -k -sS -o /dev/null \
            -w 'origin_https_http_code=%{http_code}\n' \
            --resolve pdf.plainmile.com:443:127.0.0.1 \
            https://pdf.plainmile.com/ || true
          REMOTE

      # A VPS-local 200 does not prove Cloudflare can connect to the PUBLIC
      # origin interface. Probe from the ephemeral GitHub Runner, with real
      # public SNI/Host but the netcup SSH target as the TCP destination. This
      # diagnostic is non-gating; the full Cloudflare public release gate below
      # remains mandatory and keeps rollback enabled on any failure.
      - name: Diagnose external origin TLS and release SHA (non-gating)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # Cloudflare Origin CA is intentionally not trusted by public root CAs.
          # --insecure is ONLY for this direct-origin diagnostic, never for
          # the public HTTPS release tests or real user traffic.
          case "$DEPLOY_HOST" in
            *:*) origin_host="[$DEPLOY_HOST]" ;;
            *) origin_host="$DEPLOY_HOST" ;;
          esac
          probe_body=$(mktemp)
          trap 'rm -f "$probe_body"' EXIT
          # Suppress curl's connection error text to avoid exposing secret
          # origin address/hostname in public GitHub Actions logs. The output
          # reports only status, TCP connect time, and TLS connect time.
          probe=$(curl --insecure --silent --connect-timeout 5 --max-time 12 \
            --connect-to "pdf.plainmile.com:443:${origin_host}:443" \
            -H 'Cache-Control: no-cache' -o "$probe_body" \
            -w '%{http_code}|%{time_connect}|%{time_appconnect}' \
            "https://pdf.plainmile.com/.well-known/plainmile-release?origin-diagnostic=$EXPECTED_SHA" 2>/dev/null || true)
          IFS='|' read -r status tcp_seconds tls_seconds <<EOF
          ${probe:-000|0|0}
          EOF
          echo "external_origin_https_status=${status:-000}"
          echo "external_origin_tcp_seconds=${tcp_seconds:-0}"
          echo "external_origin_tls_seconds=${tls_seconds:-0}"
          if [ "$status" = 200 ]; then
            if [ "$(cat "$probe_body")" = "$EXPECTED_SHA" ]; then
              echo 'external_origin_release_sha=match'
            else
              echo 'external_origin_release_sha=mismatch'
            fi
          else
            echo 'external_origin_release_sha=unavailable'
            echo 'If local origin is healthy but this external check fails, inspect netcup/provider firewall, public port 443 and origin DNS.'
          fi
          # Do not exit nonzero: the following Cloudflare public check is the
          # authoritative release/rollback gate even if this probe succeeded.

      - name: Verify public HTTPS, exact release SHA, SEO and worker
        id: public_gate
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # Cloudflare may still be propagating a new release. A content or
          # cache failure must fail closed instead of rolling back just because
          # somebody improved SEO headings or translated user-visible text.
          deployed_sha=''
          for attempt in $(seq 1 12); do
            deployed_sha=$(curl --fail --silent --show-error --max-time 15 \
              -H 'Cache-Control: no-cache' \
              "https://pdf.plainmile.com/.well-known/plainmile-release?sha=$EXPECTED_SHA" || true)
            if [ "$deployed_sha" = "$EXPECTED_SHA" ]; then break; fi
            sleep 3
          done
          if [ "$deployed_sha" != "$EXPECTED_SHA" ]; then
            echo "Public release SHA does not match published image ($EXPECTED_SHA)." >&2
            exit 1
          fi
          for route in / /workspace/ /zh/workspace/; do
            # Keep the original failing response's Cloudflare Ray ID: later
            # diagnostic requests may hit a different edge and return 200.
            if ! curl --fail --show-error --silent --location --retry 4 \
              -D /tmp/pdf-public-headers \
              -o /tmp/pdf-public-page.html "https://pdf.plainmile.com$route"; then
              ray=$(grep -i '^cf-ray:' /tmp/pdf-public-headers | tail -n 1 | awk '{print $2}' | tr -cd '[:alnum:]-' || true)
              echo "public_route_failed=$route cf_ray=${ray:-absent}" >&2
              exit 1
            fi
            grep -q 'rel="canonical"' /tmp/pdf-public-page.html
            grep -q 'hreflang="en"' /tmp/pdf-public-page.html
            grep -q 'hreflang="zh-CN"' /tmp/pdf-public-page.html
          done
          if ! curl -fsS -D /tmp/pdf-public-worker-headers -o /dev/null \
            https://pdf.plainmile.com/pdfjs/pdf.worker.min.mjs; then
            ray=$(grep -i '^cf-ray:' /tmp/pdf-public-worker-headers | tail -n 1 | awk '{print $2}' | tr -cd '[:alnum:]-' || true)
            echo "public_route_failed=/pdfjs/pdf.worker.min.mjs cf_ray=${ray:-absent}" >&2
            exit 1
          fi

      # Full Chromium/Firefox/WebKit regression is mandatory in PR/main CI.
      # The PUBLIC release gate checks genuine documents and all indexable SEO
      # pages only. Repeating >300 fault-injection tests over Cloudflare caused
      # a 15-minute timeout and rolled back an otherwise healthy deployment.
      - name: Public browser release smoke and SEO against deployed site
        # Fail closed on repeatable public regressions; a single transient
        # network hiccup may retry without compromising release verification.
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir -p /tmp/plainmile-public-e2e
          docker run --rm --name plainmile-pdf-public-e2e --network host \
            -v "$PWD:/work:ro" \
            -v /tmp/plainmile-public-e2e:/artifacts \
            -e PDF_BASE_URL=https://pdf.plainmile.com \
            -e LIVE_SCREENSHOT_DIR=/artifacts \
            mcr.microsoft.com/playwright:v1.55.0-noble \
            bash -lc '
              set -eu
              mkdir -p /tmp/live-tests/tests/e2e
              cp /work/tests/e2e/*.spec.mjs /tmp/live-tests/tests/e2e/
              cp /work/playwright.deploy.config.mjs /tmp/live-tests/
              cd /tmp/live-tests
              npm init -y >/dev/null
              npm install --no-audit --no-fund @playwright/test@1.55.0 pdf-lib@1.17.1 jszip@3.10.1
              # Includes public.spec.mjs (36-route SEO audit and live PDF
              # export) plus representative real PDF/ZIP/image/text workflows.
              # Do NOT run the full fault-injection suite against public HTTPS.
              npx playwright test --config=playwright.deploy.config.mjs --reporter=list --retries=1 || {
                cp -r test-results /artifacts/ || true
                exit 1
              }
            '

      # On CDN failures, gather request-level evidence BEFORE rollback,
      # while the candidate image is still running on the public origin.
      # This is strictly read-only, best-effort, and cannot change the result
      # of the public HTTPS or real-browser release gates.
      # Keep failure-only diagnostics strictly bounded, so an unreachable CDN
      # cannot delay restoring the last healthy version by ~100 seconds.
      # The original failed request already has its own CF-Ray, and one extra
      # sample per route is enough to identify potentially intermittent edges.
      - name: Diagnose failed Cloudflare public route (non-gating)
        if: ${{ failure() && steps.public_gate.outcome == 'failure' }}
        run: |
          set -euo pipefail
          for route in / /workspace/ /zh/workspace/ /pdfjs/pdf.worker.min.mjs; do
            headers=$(mktemp)
            # Public TLS stays strict. Log only status, timings, sanitized Ray ID
            # and this fixed public path; never expose origin IPs or response bodies.
            result=$(curl --silent --connect-timeout 2 --max-time 5 \
              -H 'Cache-Control: no-cache' \
              -D "$headers" -o /dev/null \
              -w '%{http_code}|%{time_connect}|%{time_appconnect}|%{time_total}' \
              "https://pdf.plainmile.com${route}?release-diag=${{ github.event.workflow_run.head_sha }}" \
              2>/dev/null || true)
            IFS='|' read -r status tcp tls total <<< "${result:-000|0|0|0}"
            ray=$(grep -im1 '^cf-ray:' "$headers" | awk '{print $2}' | tr -cd '[:alnum:]-' || true)
            rm -f "$headers"
            echo "cloudflare_probe_route=$route http_status=${status:-000} tcp_s=${tcp:-0} tls_s=${tls:-0} total_s=${total:-0} ray=${ray:-absent}"
          done
          echo 'Failure probes are non-gating; restore the previous healthy image without delay.'

      - name: Restore last healthy image if release checks fail
        if: ${{ failure() && steps.checkpoint.outputs.previous_sha != '' && steps.deploy.outcome != 'skipped' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          PREVIOUS_SHA: ${{ steps.checkpoint.outputs.previous_sha }}
          FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          if [ "$PREVIOUS_SHA" = "$FAILED_SHA" ]; then
            echo 'Previous healthy SHA equals attempted SHA; no rollback candidate.'
            exit 0
          fi
          for tag in "$PREVIOUS_SHA" "$FAILED_SHA"; do
            case "$tag" in
              *[!0-9a-f]*|'') echo 'Invalid rollback SHA' >&2; exit 1 ;;
            esac
            test "${#tag}" -eq 40
          done
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "PREVIOUS_SHA=$PREVIOUS_SHA FAILED_SHA=$FAILED_SHA /bin/sh -s" <<'REMOTE'
          set -eu
          cd /opt/compose/pdf-tools
          # Never override a newer release or an operator's manual change.
          if ! grep -qx "IMAGE_TAG=$FAILED_SHA" .env; then
            echo 'Rollback skipped: desired SHA changed since this deploy.'
            exit 0
          fi
          working_dir=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' plainmile-pdf-tools 2>/dev/null || true)
          if [ -n "$working_dir" ] && [ "$working_dir" != /opt/compose/pdf-tools ]; then
            echo 'Refusing to touch a container owned by another Compose project.' >&2
            exit 1
          fi
          umask 077
          printf 'IMAGE_TAG=%s\n' "$PREVIOUS_SHA" > .env
          # The previously healthy tag should already be cached on the VPS.
          if ! docker image inspect "ghcr.io/plainmile/pdf-tools:$PREVIOUS_SHA" >/dev/null 2>&1; then
            docker compose -f compose.prod.yaml pull
          fi
          docker compose -f compose.prod.yaml up -d
          for i in $(seq 1 24); do
            status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' plainmile-pdf-tools 2>/dev/null || true)
            if [ "$status" = healthy ]; then
              working_dir=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' plainmile-pdf-tools)
              image=$(docker inspect -f '{{.Config.Image}}' plainmile-pdf-tools)
              if [ "$working_dir" = /opt/compose/pdf-tools ] &&
                 [ "$image" = "ghcr.io/plainmile/pdf-tools:$PREVIOUS_SHA" ]; then
                echo "Rollback restored healthy image $PREVIOUS_SHA"
                exit 0
              fi
              echo 'Rollback produced an unexpected container/image.' >&2
              exit 1
            fi
            sleep 5
          done
          docker compose -f compose.prod.yaml ps
          docker logs --tail 60 plainmile-pdf-tools || true
          echo 'Rollback did not reach healthy status.' >&2
          exit 1
          REMOTE

      - name: Retain public E2E diagnostics only on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-production-qa-failure
          path: /tmp/plainmile-public-e2e/
          if-no-files-found: ignore
          retention-days: 1

      - name: Release public E2E Docker and temporary resources
        if: always()
        run: |
          docker rm -f plainmile-pdf-public-e2e >/dev/null 2>&1 || true
          # The Playwright container creates root-owned diagnostics on failures.
          # The ephemeral GitHub-hosted runner has sudo; remove all artifacts reliably.
          sudo rm -rf -- /tmp/plainmile-public-e2e
