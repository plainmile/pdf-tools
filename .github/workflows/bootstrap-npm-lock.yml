name: Bootstrap NPM lock (temporary branch-only workflow)

on:
  push:
    branches: [feature/reproducible-npm-lock]
    paths: [.github/workflows/bootstrap-npm-lock.yml]

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ github.repository == 'plainmile/pdf-tools' && github.ref == 'refs/heads/feature/reproducible-npm-lock' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout the isolated feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate real npm v10 lockfile using Node 22 Docker
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/app" -w /app node:22-bookworm-slim \
            sh -lc 'npm install --package-lock-only --ignore-scripts --no-audit --no-fund'
          test -s package-lock.json
          docker run --rm -v "$PWD:/app" -w /app node:22-bookworm-slim \
            sh -lc 'npm ci --ignore-scripts --no-audit --no-fund --dry-run >/dev/null'
      - name: Commit only generated lockfile to the feature branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already up to date.'
            exit 0
          fi
          git commit -m 'build: generate Node 22 npm lockfile with registry integrity hashes'
          git push origin HEAD:refs/heads/feature/reproducible-npm-lock
